name: Announce new projects on Telegram and X

on:
  push:
    branches:
      - main
    paths:
      - "ecosystem/**"
  workflow_dispatch:
    inputs:
      slug:
        description: "Project slug(s) to announce, comma-separated"
        required: true
      dry_run:
        description: "Generate preview artifacts without publishing to Telegram or X"
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  notify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Announce projects
        run: node scripts/notify-telegram.mjs
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          X_API_KEY: ${{ secrets.X_API_KEY }}
          X_API_SECRET: ${{ secrets.X_API_SECRET }}
          X_ACCESS_TOKEN: ${{ secrets.X_ACCESS_TOKEN }}
          X_ACCESS_SECRET: ${{ secrets.X_ACCESS_SECRET }}
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
          SLUG: ${{ inputs.slug }}
          SITE_URL: https://lit-hub.org
          DRY_RUN: ${{ inputs.dry_run || 'false' }}
      - name: Save announcement cards and text
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: announcement-cards
          path: output/announcements/
          if-no-files-found: ignore
          retention-days: 14
